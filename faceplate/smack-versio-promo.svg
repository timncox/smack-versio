<text x="12.95" y="55.92" font-family="Helvetica, Arial, sans-serif" font-size="2.0" font-weight="bold" fill="#f2f2f2" text-anchor="start">CLK</text>
<text x="12.95" y="58.42" font-family="Helvetica, Arial, sans-serif" font-size="1.4" font-weight="normal" fill="#8a8a8a" text-anchor="start">/2</text>
<text x="12.95" y="60.12" font-family="Helvetica, Arial, sans-serif" font-size="1.4" font-weight="normal" fill="#8a8a8a" text-anchor="start">=1</text>
<text x="12.95" y="61.82" font-family="Helvetica, Arial, sans-serif" font-size="1.4" font-weight="normal" fill="#8a8a8a" text-anchor="start">x2</text>
<circle cx="8.35" cy="67.34" r="2.55" fill="#000000" stroke="#5a5a5a" stroke-width="0.15"/>
<text x="12.95" y="65.44" font-family="Helvetica, Arial, sans-serif" font-size="2.0" font-weight="bold" fill="#f2f2f2" text-anchor="start">GATE</text>
<text x="12.95" y="67.94" font-family="Helvetica, Arial, sans-serif" font-size="1.4" font-weight="normal" fill="#8a8a8a" text-anchor="start">CLK</text>
<text x="12.95" y="69.64" font-family="Helvetica, Arial, sans-serif" font-size="1.4" font-weight="normal" fill="#8a8a8a" text-anchor="start">AUTO</text>
<text x="12.95" y="71.34" font-family="Helvetica, Arial, sans-serif" font-size="1.4" font-weight="normal" fill="#8a8a8a" text-anchor="start">DUAL</text>
<circle cx="25.10" cy="67.34" r="3.00" fill="#000000" stroke="#5a5a5a" stroke-width="0.2"/>
<text x="25.10" y="72.74" font-family="Helvetica, Arial, sans-serif" font-size="2.1" font-weight="bold" fill="#f2f2f2" text-anchor="middle">CAPTURE</text>
<text x="25.10" y="74.84" font-family="Helvetica, Arial, sans-serif" font-size="1.5" font-weight="normal" fill="#8a8a8a" text-anchor="middle">tap = re-roll</text>
<circle cx="5.18" cy="83.19" r="3.40" fill="#000000" stroke="#5a5a5a" stroke-width="0.18"/>
<text x="5.18" y="78.59" font-family="Helvetica, Arial, sans-serif" font-size="1.75" font-weight="bold" fill="#f2f2f2" text-anchor="middle">FX</text>
<circle cx="18.50" cy="83.19" r="3.40" fill="#000000" stroke="#5a5a5a" stroke-width="0.18"/>
<text x="18.50" y="78.59" font-family="Helvetica, Arial, sans-serif" font-size="1.75" font-weight="bold" fill="#f2f2f2" text-anchor="middle">ORDER</text>
<circle cx="31.82" cy="83.19" r="3.40" fill="#000000" stroke="#5a5a5a" stroke-width="0.18"/>
<text x="31.82" y="78.59" font-family="Helvetica, Arial, sans-serif" font-size="1.75" font-weight="bold" fill="#f2f2f2" text-anchor="middle">LENGTH</text>
<circle cx="44.50" cy="83.19" r="3.40" fill="#000000" stroke="#5a5a5a" stroke-width="0.18"/>
<text x="44.50" y="78.59" font-family="Helvetica, Arial, sans-serif" font-size="1.75" font-weight="bold" fill="#f2f2f2" text-anchor="middle">SLICE</text>
<circle cx="5.18" cy="97.15" r="3.40" fill="#000000" stroke="#5a5a5a" stroke-width="0.18"/>
<text x="5.18" y="92.55" font-family="Helvetica, Arial, sans-serif" font-size="1.75" font-weight="bold" fill="#f2f2f2" text-anchor="middle">BLEND</text>
<circle cx="18.50" cy="97.15" r="3.40" fill="#000000" stroke="#5a5a5a" stroke-width="0.18"/>
<text x="18.50" y="92.55" font-family="Helvetica, Arial, sans-serif" font-size="1.75" font-weight="bold" fill="#f2f2f2" text-anchor="middle">SEED</text>
<circle cx="31.82" cy="97.15" r="3.40" fill="#000000" stroke="#5a5a5a" stroke-width="0.18"/>
<text x="31.82" y="92.55" font-family="Helvetica, Arial, sans-serif" font-size="1.75" font-weight="bold" fill="#f2f2f2" text-anchor="middle">PITCH</text>
<circle cx="44.50" cy="97.15" r="3.40" fill="#000000" stroke="#5a5a5a" stroke-width="0.18"/>
<text x="44.50" y="92.55" font-family="Helvetica, Arial, sans-serif" font-size="1.75" font-weight="bold" fill="#f2f2f2" text-anchor="middle">CLK</text>
<circle cx="5.18" cy="111.10" r="3.40" fill="#000000" stroke="#5a5a5a" stroke-width="0.18"/>
<text x="5.18" y="106.50" font-family="Helvetica, Arial, sans-serif" font-size="1.75" font-weight="bold" fill="#f2f2f2" text-anchor="middle">IN L</text>
<circle cx="18.50" cy="111.10" r="3.40" fill="#000000" stroke="#5a5a5a" stroke-width="0.18"/>
<text x="18.50" y="106.50" font-family="Helvetica, Arial, sans-serif" font-size="1.75" font-weight="bold" fill="#f2f2f2" text-anchor="middle">IN R</text>
<circle cx="31.82" cy="111.10" r="3.40" fill="#000000" stroke="#5a5a5a" stroke-width="0.18"/>
<text x="31.82" y="106.50" font-family="Helvetica, Arial, sans-serif" font-size="1.75" font-weight="bold" fill="#f2f2f2" text-anchor="middle">OUT L</text>
<circle cx="44.50" cy="111.10" r="3.40" fill="#000000" stroke="#5a5a5a" stroke-width="0.18"/>
<text x="44.50" y="106.50" font-family="Helvetica, Arial, sans-serif" font-size="1.75" font-weight="bold" fill="#f2f2f2" text-anchor="middle">OUT R</text>
<text x="25.22" y="122.74" font-family="Helvetica, Arial, sans-serif" font-size="1.4" font-weight="normal" fill="#8a8a8a" text-anchor="middle">third-party firmware</text>
<text x="25.22" y="124.94" font-family="Helvetica, Arial, sans-serif" font-size="1.4" font-weight="normal" fill="#8a8a8a" text-anchor="middle">not a Noise Engineering product</text>
</g>
<text x="344" y="1549" font-size="19" fill="#8b98a3" text-anchor="middle">10 HP &#183; panel drawn from the measured hole centres</text>
<text x="718.9279999999999" y="96" font-size="82" font-weight="700" fill="#f4f7f9" letter-spacing="2">SMACK</text>
<text x="718.9279999999999" y="138" font-size="31" fill="#4fd8e8" font-weight="600">alternative firmware for the Noise Engineering Versio</text>
<text x="718.9279999999999" y="178" font-size="27" fill="#8b98a3">Catch what you just played. Cut it up. Let a seed decide the rest.</text>
<text x="718.9279999999999" y="240" font-size="25" fill="#f4f7f9">Audio runs through constantly and is always being recorded. Hold CAPTURE and the</text>
<text x="718.9279999999999" y="273" font-size="25" fill="#f4f7f9">last few bars become a loop — no arming, no deciding in advance that you wanted it.</text>
<text x="718.9279999999999" y="306" font-size="25" fill="#8b98a3">That loop is sliced on a grid, the slices are re-ordered, and some of them get an</text>
<text x="718.9279999999999" y="339" font-size="25" fill="#8b98a3">effect. Which ones, which effects, and in what order all follow from one SEED.</text>
<line x1="718.9279999999999" y1="398" x2="1930" y2="398" stroke="#243039" stroke-width="2"/>
<text x="718.9279999999999" y="440" font-size="27" font-weight="700" fill="#4fd8e8" letter-spacing="1.2">CAPTURE</text>
<text x="730.9279999999999" y="476" font-size="25" font-weight="700" fill="#4fd8e8">hold ~1 s</text>
<text x="950.9279999999999" y="476" font-size="25" fill="#f4f7f9">grab the last LENGTH steps of what you played</text>
<text x="730.9279999999999" y="508" font-size="25" font-weight="700" fill="#4fd8e8">tap</text>
<text x="950.9279999999999" y="508" font-size="25" fill="#f4f7f9">re-roll — same loop, brand new pattern</text>
<text x="730.9279999999999" y="540" font-size="25" font-weight="700" fill="#4fd8e8">double-tap</text>
<text x="950.9279999999999" y="540" font-size="25" fill="#f4f7f9">LIVE: re-captures itself once per loop pass</text>
<text x="730.9279999999999" y="572" font-size="25" font-weight="700" fill="#4fd8e8">hold 2 s</text>
<text x="950.9279999999999" y="572" font-size="25" fill="#f4f7f9">drop the loop, back to dry passthrough</text>
<text x="718.9279999999999" y="626" font-size="27" font-weight="700" fill="#5fe08a" letter-spacing="1.2">THE PATTERN</text>
<text x="730.9279999999999" y="662" font-size="25" font-weight="700" fill="#5fe08a">SEED</text>
<text x="950.9279999999999" y="662" font-size="25" fill="#f4f7f9">which pattern. Same seed, same result, every time</text>
<text x="730.9279999999999" y="694" font-size="25" font-weight="700" fill="#5fe08a">FX</text>
<text x="950.9279999999999" y="694" font-size="25" fill="#f4f7f9">how many slices get an effect, from none to all</text>
<text x="730.9279999999999" y="726" font-size="25" font-weight="700" fill="#5fe08a">ORDER</text>
<text x="950.9279999999999" y="726" font-size="25" fill="#f4f7f9">how scrambled the slice order is</text>
<text x="730.9279999999999" y="758" font-size="25" font-weight="700" fill="#5fe08a">SLICE</text>
<text x="950.9279999999999" y="758" font-size="25" fill="#f4f7f9">how finely the loop is cut up</text>
<text x="730.9279999999999" y="790" font-size="25" font-weight="700" fill="#5fe08a">LENGTH</text>
<text x="950.9279999999999" y="790" font-size="25" fill="#f4f7f9">8 / 16 / 32 / 64 / 128 / 256 steps (256 = 16 bars)</text>
<text x="730.9279999999999" y="822" font-size="25" font-weight="700" fill="#5fe08a">PITCH</text>
<text x="950.9279999999999" y="822" font-size="25" fill="#f4f7f9">how far the pitch effects are allowed to move</text>
<text x="718.9279999999999" y="876" font-size="27" font-weight="700" fill="#ffb454" letter-spacing="1.2">BLEND &amp; CLOCK</text>
<text x="730.9279999999999" y="912" font-size="25" font-weight="700" fill="#ffb454">BLEND</text>
<text x="950.9279999999999" y="912" font-size="25" fill="#f4f7f9">your live input vs the effected loop. Fully left is dry</text>
<text x="730.9279999999999" y="944" font-size="25" font-weight="700" fill="#ffb454">CLK jack</text>
<text x="950.9279999999999" y="944" font-size="25" fill="#f4f7f9">clock in. Nothing patched? It free-runs, and that is fine</text>
<text x="730.9279999999999" y="976" font-size="25" font-weight="700" fill="#ffb454">CLK switch</text>
<text x="950.9279999999999" y="976" font-size="25" fill="#f4f7f9">clock ratio: /2, =1, x2</text>
<text x="730.9279999999999" y="1008" font-size="25" font-weight="700" fill="#ffb454">GATE switch</text>
<text x="950.9279999999999" y="1008" font-size="25" fill="#f4f7f9">clock, auto, or DUAL — two independent L/R lanes</text>
<text x="718.9279999999999" y="1062" font-size="27" font-weight="700" fill="#c08cff" letter-spacing="1.2">THE LIGHTS</text>
<text x="730.9279999999999" y="1098" font-size="25" font-weight="700" fill="#c08cff">STATE</text>
<text x="950.9279999999999" y="1098" font-size="25" fill="#f4f7f9">blue idle · red recording · green looping · cyan LIVE</text>
<text x="730.9279999999999" y="1130" font-size="25" font-weight="700" fill="#c08cff">PLAY</text>
<text x="950.9279999999999" y="1130" font-size="25" fill="#f4f7f9">ramps once per pass through the loop</text>
<text x="730.9279999999999" y="1162" font-size="25" font-weight="700" fill="#c08cff">CLOCK</text>
<text x="950.9279999999999" y="1162" font-size="25" fill="#f4f7f9">clock source — and red if the CPU goes over 80%</text>
<line x1="718.9279999999999" y1="1222" x2="1930" y2="1222" stroke="#243039" stroke-width="2"/>
<text x="718.9279999999999" y="1262" font-size="27" font-weight="700" fill="#ff7ab8" letter-spacing="1.2">QUICK START</text>
<text x="730.9279999999999" y="1298" font-size="25" font-weight="700" fill="#ff7ab8">1</text>
<text x="762.9279999999999" y="1298" font-size="25" fill="#f4f7f9">Patch audio to IN L / IN R. It passes through straight away.</text>
<text x="730.9279999999999" y="1330" font-size="25" font-weight="700" fill="#ff7ab8">2</text>
<text x="762.9279999999999" y="1330" font-size="25" fill="#f4f7f9">Play something. Hold CAPTURE for about a second.</text>
<text x="730.9279999999999" y="1362" font-size="25" font-weight="700" fill="#ff7ab8">3</text>
<text x="762.9279999999999" y="1362" font-size="25" fill="#f4f7f9">Bring up FX and ORDER, then turn SEED until you like it.</text>
<text x="730.9279999999999" y="1394" font-size="25" font-weight="700" fill="#ff7ab8">4</text>
<text x="762.9279999999999" y="1394" font-size="25" fill="#f4f7f9">BLEND decides how much of the mangling you hear.</text>
<text x="730.9279999999999" y="1426" font-size="25" font-weight="700" fill="#ff7ab8">5</text>
<text x="762.9279999999999" y="1426" font-size="25" fill="#f4f7f9">Tap CAPTURE for a new pattern. Hold 2 s to let the loop go.</text>
<line x1="718.9279999999999" y1="1498" x2="1930" y2="1498" stroke="#243039" stroke-width="2"/>
<text x="718.9279999999999" y="1536" font-size="25" fill="#ff7ab8" font-weight="700">Free &amp; open source — timncox.github.io/smack-versio</text>
<text x="718.9279999999999" y="1568" font-size="21" fill="#8b98a3">Third-party firmware. Not a Noise Engineering product and not supported by them. Reversible: flash any official NE firmware to go back.</text>
</svg>