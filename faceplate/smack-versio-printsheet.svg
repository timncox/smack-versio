<text x="52.50" y="157.74" font-family="Helvetica, Arial, sans-serif" font-size="2.2" font-weight="normal" fill="#444444" text-anchor="middle">If it does not, reprint at 100% / &#8220;Actual size&#8221;. Do not cut until it does.</text>
<text x="6.00" y="164.34" font-family="Helvetica, Arial, sans-serif" font-size="2.2" font-weight="normal" fill="#333333" text-anchor="start">1.  Verify the ruler above. Everything else depends on it.</text>
<text x="6.00" y="167.64" font-family="Helvetica, Arial, sans-serif" font-size="2.2" font-weight="normal" fill="#333333" text-anchor="start">2.  Cut the outline, then the holes. Dashed circles are knob bushings;</text>
<text x="6.00" y="170.94" font-family="Helvetica, Arial, sans-serif" font-size="2.2" font-weight="normal" fill="#333333" text-anchor="start">     the knob caps are wider than the hole, so pull the caps first.</text>
<text x="6.00" y="174.24" font-family="Helvetica, Arial, sans-serif" font-size="2.2" font-weight="normal" fill="#333333" text-anchor="start">3.  Hole positions come from a 1:1 template; the CAPTURE button was placed</text>
<text x="6.00" y="177.54" font-family="Helvetica, Arial, sans-serif" font-size="2.2" font-weight="normal" fill="#333333" text-anchor="start">     from the hardware by eye. Good enough to fit — measure before you</text>
<text x="6.00" y="180.84" font-family="Helvetica, Arial, sans-serif" font-size="2.2" font-weight="normal" fill="#333333" text-anchor="start">     machine anything. See MEASURE.md.</text>
<text x="6.00" y="184.14" font-family="Helvetica, Arial, sans-serif" font-size="2.2" font-weight="normal" fill="#333333" text-anchor="start">4.  Fit behind the knobs and switches, or trim and use it as a bench card.</text>
<text x="6.00" y="187.44" font-family="Helvetica, Arial, sans-serif" font-size="2.2" font-weight="normal" fill="#333333" text-anchor="start">5.  Turn each knob and watch which LED moves. If the legend is scrambled,</text>
<text x="6.00" y="190.74" font-family="Helvetica, Arial, sans-serif" font-size="2.2" font-weight="normal" fill="#333333" text-anchor="start">     the knob-to-ADC order in smack_versio.cpp is wrong, not this print.</text>
